name: CI

# Run the full local toolchain automatically on the two long-lived branches and
# on every PR that targets them. Feature PRs target `develop`; release/hotfix PRs
# target `main`. The workflow that runs is the one present in the PR's head branch,
# so this pipeline executes on the very first PR that introduces it — even before
# `develop` contains the file.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# Cancel any in-progress run for the same ref when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 LTS: the project pins no .nvmrc / engines, so CI fixes a known LTS.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci (not npm install): reproducible, fails if package-lock.json drifts.
      - name: Install dependencies
        run: npm ci

      # Lint includes the Clean Architecture barrier (no-restricted-imports on
      # src/domain/**): a domain->data dependency regression fails CI here.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Native/SDK drift guard: the Node test job can't see version skew between
      # Expo SDK 54 and its sibling packages (the kind that broke the dev build).
      # expo-doctor surfaces it in CI. Legitimate, non-fixable checks should be
      # narrowed via expo.install.exclude in package.json, not by dropping this step.
      - name: Expo Doctor
        run: npx --yes expo-doctor
        continue-on-error: true

      # --ci: no snapshot writes; --coverage: enforces the scoped coverageThreshold
      # (src/domain, src/data) configured in jest.config.js.
      # --json --outputFile writes per-file timings alongside the normal reporter
      # output; it changes nothing about what this step asserts or its exit code.
      # The runner is the only machine whose timings matter for testTimeout, and
      # until now it recorded none.
      - name: Test
        run: npx jest --ci --coverage --json --outputFile=jest-timings.json

      # Uploaded on failure too - a run that blew the timeout is exactly the one
      # whose timings need reading.
      - name: Upload jest timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-timings
          path: jest-timings.json
          if-no-files-found: warn
