# Maestro end-to-end flow - Valto
#
# Wallet delete anyway
# Creates a wallet, adds two expenses to it, deletes it with "Delete Anyway",
# then checks both expenses remain, labelled with the unknown wallet, and that
# the other wallets' balances did not change. Coverage of REGISTRE V-127 a.
#
# The other balances are read, exact, from the wallet picker of the add form
# before anything else is done, and compared with the same reading after the
# delete.
#
# The wallets screen shows its cards in a horizontal list, and the new wallet
# is the last card: the list is swiped until its card shows.
#
# Amounts are matched with "." in place of the currency sign (flows are ASCII).
#
# Prerequisites: create_wallet passed (see config.yaml): "Main Account" and
# "Savings Account" exist.
# Synthetic data only.
# Run: scripts/run-e2e.sh <apk>, or maestro test .maestro/wallet_delete_anyway.yaml

appId: com.renkakpo.valto.app
---

# --- Launch ---
- launchApp

# A cold start can take tens of seconds on a loaded host (pass 96 runs): wait
# for the tab bar before the first tap.
- extendedWaitUntil:
    visible:
      id: "tab_index"
    timeout: 60000

# An Android "isn't responding" dialog, if one is up, is answered "Wait".
- runFlow: subflows/dismiss_not_responding.yaml

# --- Read the other wallets' balances ---
- tapOn:
    id: "tab_wallets"

- tapOn:
    id: "fab_add_transaction"

- assertVisible:
    id: "add_tx_amount_input"

- tapOn:
    id: "add_tx_wallet_picker"

- copyTextFrom:
    text: ".*[0-9]\\.[0-9][0-9]"
    childOf:
      id: "add_tx_wallet_[0-9a-f]{8}-.*"
      containsDescendants:
        - text: "Main Account"

- evalScript: ${output.mainBefore = maestro.copiedText}

- copyTextFrom:
    text: ".*[0-9]\\.[0-9][0-9]"
    childOf:
      id: "add_tx_wallet_[0-9a-f]{8}-.*"
      containsDescendants:
        - text: "Savings Account"

- evalScript: ${output.savingsBefore = maestro.copiedText}

- tapOn:
    id: "add_tx_close_button"

- assertNotVisible:
    id: "add_tx_amount_input"

# --- Create the wallet ---
- tapOn:
    id: "wallets_add_button"

- assertVisible:
    id: "add_wallet_name_input"

- tapOn:
    id: "add_wallet_name_input"

- inputText: "E2E Delete Wallet"

- tapOn:
    id: "add_wallet_balance_input"

- inputText: "100"

- tapOn:
    id: "add_wallet_save_button"

- assertNotVisible:
    id: "add_wallet_name_input"

# --- Two expenses on it: Nourriture 12.34 and 56.78 ---
- tapOn:
    id: "fab_add_transaction"

- assertVisible:
    id: "add_tx_amount_input"

- tapOn:
    id: "add_tx_type_expense"

- tapOn:
    id: "add_tx_category_picker"

- tapOn:
    id: "add_tx_category_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "Nourriture"

- tapOn:
    id: "add_tx_wallet_picker"

- tapOn:
    id: "add_tx_wallet_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "E2E Delete Wallet"

- tapOn:
    id: "add_tx_amount_input"

- inputText: "12.34"

- tapOn:
    id: "add_tx_save_button"

- assertNotVisible:
    id: "add_tx_amount_input"

- tapOn:
    id: "fab_add_transaction"

- assertVisible:
    id: "add_tx_amount_input"

- tapOn:
    id: "add_tx_type_expense"

- tapOn:
    id: "add_tx_category_picker"

- tapOn:
    id: "add_tx_category_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "Nourriture"

- tapOn:
    id: "add_tx_wallet_picker"

- tapOn:
    id: "add_tx_wallet_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "E2E Delete Wallet"

- tapOn:
    id: "add_tx_amount_input"

- inputText: "56.78"

- tapOn:
    id: "add_tx_save_button"

- assertNotVisible:
    id: "add_tx_amount_input"

# --- Delete the wallet: "Delete Anyway" ---
# A fresh launch puts the card list back at its start. The list snaps card by
# card: a drag shorter than half a card snaps back unless Android reads it as
# a fast fling, which a loaded host does not reliably produce (pass 96). So
# each swipe is a slow drag across most of the card band, from 85% to 15% of
# the width at 29% of the height (the band spans about 17% to 41% of the
# height on valto_e2e_api36). It starts away from both screen edges, where a
# swipe is taken by Android as the Back gesture.
# The new card is found by the card's own label, which holds the wallet name
# even while the card only peeks in at the screen edge with its name text cut
# off; it is then tapped where it shows. The wallets screen also lists recent
# transactions, whose rows name the wallet, so a bare text match would not do.
- launchApp

# A cold start can take tens of seconds on a loaded host (pass 96 runs): wait
# for the tab bar before the first tap.
- extendedWaitUntil:
    visible:
      id: "tab_index"
    timeout: 60000

# An Android "isn't responding" dialog, if one is up, is answered "Wait".
- runFlow: subflows/dismiss_not_responding.yaml

- tapOn:
    id: "tab_wallets"

- repeat:
    times: 4
    while:
      notVisible:
        id: "wallet_card_[0-9a-f]{8}-.*"
        text: ".*E2E Delete Wallet"
    commands:
      - swipe:
          start: "85%, 29%"
          end: "15%, 29%"
          duration: 1500

- tapOn:
    id: "wallet_card_[0-9a-f]{8}-.*"
    text: ".*E2E Delete Wallet"

- assertVisible:
    id: "edit_wallet_name_input"

# The delete button is the last control of the edit sheet, which is drawn
# over the tab bar: it can never reach the middle of the screen, so it is
# scrolled to until fully visible, without centring (pass 99).
- scrollUntilVisible:
    element:
      id: "edit_wallet_delete_button"
    visibilityPercentage: 100

- tapOn:
    id: "edit_wallet_delete_button"

- tapOn:
    text: "(?i)delete anyway"

- assertNotVisible:
    id: "edit_wallet_name_input"

- assertNotVisible:
    id: "wallet_card_[0-9a-f]{8}-.*"
    text: ".*E2E Delete Wallet"

# --- Both expenses remain, with the unknown wallet ---
- tapOn:
    id: "tab_transactions"

- assertVisible:
    id: "transaction_list_row_.*"
    containsDescendants:
      - text: "Nourriture"
      - id: "transaction_row_subtitle"
        text: "Unknown"
      - text: "-.12\\.34"

- assertVisible:
    id: "transaction_list_row_.*"
    containsDescendants:
      - text: "Nourriture"
      - id: "transaction_row_subtitle"
        text: "Unknown"
      - text: "-.56\\.78"

# --- The other balances did not change ---
- tapOn:
    id: "fab_add_transaction"

- assertVisible:
    id: "add_tx_amount_input"

- tapOn:
    id: "add_tx_wallet_picker"

- assertNotVisible:
    id: "add_tx_wallet_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "E2E Delete Wallet"

- copyTextFrom:
    text: ".*[0-9]\\.[0-9][0-9]"
    childOf:
      id: "add_tx_wallet_[0-9a-f]{8}-.*"
      containsDescendants:
        - text: "Main Account"

- assertTrue: ${maestro.copiedText == output.mainBefore}

- copyTextFrom:
    text: ".*[0-9]\\.[0-9][0-9]"
    childOf:
      id: "add_tx_wallet_[0-9a-f]{8}-.*"
      containsDescendants:
        - text: "Savings Account"

- assertTrue: ${maestro.copiedText == output.savingsBefore}

- tapOn:
    id: "add_tx_close_button"

- assertNotVisible:
    id: "add_tx_amount_input"
