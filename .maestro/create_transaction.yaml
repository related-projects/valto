# Maestro end-to-end flow - Valto
#
# Create transaction
# Adds an expense from the Transactions tab and checks its row is listed.
#
# Prerequisites: onboarding completed, so the "Main Account" wallet exists and
# is the first wallet (onboarding.yaml runs first, see config.yaml).
# Synthetic data only.
# Run: scripts/run-e2e.sh <apk>, or maestro test .maestro/create_transaction.yaml

appId: com.renkakpo.valto.app
---

# --- Launch ---
- launchApp

# An Android "isn't responding" dialog, if one is up, is answered "Wait".
- runFlow: subflows/dismiss_not_responding.yaml

# --- Open the add-transaction sheet ---
- tapOn:
    id: "tab_transactions"

- tapOn:
    id: "fab_add_transaction"

- assertVisible:
    id: "add_tx_amount_input"

# --- Fill the form ---
- tapOn:
    id: "add_tx_type_expense"

# The category is picked before the amount, so no keyboard covers the picker.
# Default categories are seeded as French literals (src/data/seed/seedData.ts);
# "Transport" is one of them.
- tapOn:
    id: "add_tx_category_picker"

- tapOn:
    text: "Transport"

- tapOn:
    id: "add_tx_amount_input"

- inputText: "37"

# --- Save (header button, above the keyboard) ---
- tapOn:
    id: "add_tx_save_button"

# --- Check the created transaction ---
# A row names its category and its wallet; the wallet picker defaults to the
# first wallet, the one onboarding created.
- assertVisible:
    id: "transaction_list_row_.*"
    containsDescendants:
      - text: "Transport"
      - text: "Main Account"
