# Maestro workspace configuration - Valto end-to-end flows
#
# scripts/run-e2e.sh installs the APK fresh, so the flows share one app state
# and must run in this order. Every flow runs and is reported, even after a
# failure, so one run shows the state of the whole suite. A flow that uses
# data made by an earlier one can fail because that one did, so read a
# failure against the earlier results first:
#  - onboarding clears the app state and creates the first wallet, "Main
#    Account"; every other flow needs a completed onboarding.
#  - create_wallet adds "Savings Account": transaction_dates and
#    wallet_delete_anyway rely on it.
#  - change_settings sets the YYYY-MM-DD date format that transaction_dates
#    reads on the detail screen.
#
# subflows/ holds steps the flows call with runFlow; the workspace run does
# not take them for flows.

executionOrder:
  continueOnFailure: true
  flowsOrder:
    - onboarding
    - create_wallet
    - create_transaction
    - change_settings
    - backup_restore
    - transaction_dates
    - amount_cap_compact
    - wallet_delete_anyway
    - category_type_switch
    - settings_reachability
    - month_start_day
