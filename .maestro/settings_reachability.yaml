# Maestro end-to-end flow - Valto
#
# Settings reachability
# Scrolls Settings to its last row, "About Valto", requires it fully visible
# and above the tab bar, and taps it: the About screen must open.
#
# The tab bar is drawn over the bottom of the list, so the last row is only
# usable if the list ends with enough room under it. A tap on a row hidden by
# the tab bar would reach the tab bar instead, and About would not open.
#
# The last row can never reach the middle of the screen, so it is not
# centred: a centring scroll only ended once its retries were spent, and on
# a loaded host they can run past the timeout (pass 99). Nor is "fully
# visible" enough on its own: the tab bar is drawn over the list, Android
# reports a row under it with its full bounds, and Maestro counts that row
# as fully visible. So the row is first scrolled to until fully visible,
# then one slow drag takes the list to its end: once the row is on screen,
# less than half the drag is left to scroll (about 420 of 960 px on
# valto_e2e_api36). The row is then checked where the list ends, the
# position the app controls.
#
# Maestro's "above" compares top edges only: it shows the row starts above
# the tab bar. That the whole row clears the tab bar is shown by the tap
# opening About, and by the row and tab bar bounds in the pass 96 report.
#
# Prerequisites: onboarding completed (see config.yaml).
# Run: scripts/run-e2e.sh <apk>, or maestro test .maestro/settings_reachability.yaml

appId: com.renkakpo.valto.app
---

# --- Launch ---
- launchApp

# A cold start can take tens of seconds on a loaded host (pass 96 runs): wait
# for the tab bar before the first tap.
- extendedWaitUntil:
    visible:
      id: "tab_index"
    timeout: 60000

# An Android "isn't responding" dialog, if one is up, is answered "Wait".
- runFlow: subflows/dismiss_not_responding.yaml

# --- Navigate to Settings ---
- tapOn:
    id: "tab_settings"

# --- Scroll to the last row ---
- scrollUntilVisible:
    element:
      text: "About Valto"
    visibilityPercentage: 100

- swipe:
    start: "50%, 70%"
    end: "50%, 30%"
    duration: 1500

- assertVisible:
    text: "About Valto"
    above:
      id: "tab_settings"

# --- Tap it ---
- tapOn:
    text: "About Valto"

- assertVisible:
    id: "about_app_logo"
