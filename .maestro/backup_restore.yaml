# Maestro end-to-end flow - Valto
#
# Backup and restore
# Creates a backup and closes the share sheet, then opens both restore
# confirmations and cancels the second one. Nothing is restored: the
# "Restore Now" button is never pressed, and the file picker is never opened.
#
# The confirmations are native Android Alerts, matched by text
# case-insensitively (Android may draw dialog buttons in upper case).
#
# Prerequisites: onboarding completed (see config.yaml).
# Run: scripts/run-e2e.sh <apk>, or maestro test .maestro/backup_restore.yaml

appId: com.renkakpo.valto.app
---

# --- Launch ---
- launchApp

# --- Navigate to Settings ---
- tapOn:
    id: "tab_settings"

# --- Backup ---
- scrollUntilVisible:
    element:
      id: "settings_backup_item"

- tapOn:
    id: "settings_backup_item"

# The backup is written, then handed to the Android share sheet (system UI).
# On failure the app shows an alert titled "Backup Failed" instead.
- waitForAnimationToEnd:
    timeout: 5000

- assertNotVisible:
    text: "Backup Failed"

# Close the share sheet without sharing anything.
- back

- assertVisible:
    id: "settings_backup_item"

# --- Restore: confirm the first alert, cancel the second ---
- tapOn:
    id: "settings_restore_item"

- tapOn:
    text: "(?i)continue"

- assertVisible:
    text: "Are you absolutely sure.*"

- tapOn:
    text: "(?i)cancel"

- assertNotVisible:
    text: "Are you absolutely sure.*"

- assertVisible:
    id: "settings_restore_item"
