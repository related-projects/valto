# Maestro end-to-end flow - Valto
#
# Change settings
# Changes the theme and the date format, and checks each row shows the new
# value.
#
# Both choices open a native Android Alert, which has no testID. Its buttons
# are matched by text: case-insensitively, since Android may draw dialog
# buttons in upper case, and with a trailing ".*", since the current choice
# carries a check mark suffix.
#
# Prerequisites: onboarding completed (see config.yaml).
# Run: scripts/run-e2e.sh <apk>, or maestro test .maestro/change_settings.yaml

appId: com.renkakpo.valto.app
---

# --- Launch ---
- launchApp

# --- Navigate to Settings ---
- tapOn:
    id: "tab_settings"

# --- Theme ---
- tapOn:
    id: "settings_theme_item"

- tapOn:
    text: "(?i)dark.*"

- assertVisible:
    id: "settings_theme_item"
    containsDescendants:
      - text: "Dark"

# --- Date format ---
- scrollUntilVisible:
    element:
      id: "settings_date_format_item"

- tapOn:
    id: "settings_date_format_item"

- tapOn:
    text: "YYYY-MM-DD.*"

- assertVisible:
    id: "settings_date_format_item"
    containsDescendants:
      - text: "YYYY-MM-DD"
