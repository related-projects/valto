# Maestro end-to-end flow - Valto
#
# Onboarding
# Goes through first launch: welcome, currency, back navigation, first wallet,
# completion, and checks the wallet is listed on the dashboard.
#
# Prerequisites: none; the app state is cleared at launch.
# Synthetic data only.
# Run: scripts/run-e2e.sh <apk>, or maestro test .maestro/onboarding.yaml

appId: com.renkakpo.valto.app
---

# --- App launch ---
- launchApp:
    clearState: true

# --- Welcome screen ---
- assertVisible:
    id: "onboarding_get_started"

- tapOn:
    id: "onboarding_get_started"

# --- Currency selection ---
# The list is long; filter to the target instead of scrolling to it.
# Selecting a currency auto-advances - there is no separate "next" tap here.
- assertVisible:
    id: "currency_search_input"

- tapOn:
    id: "currency_search_input"

- inputText: "USD"

- tapOn:
    id: "currency_item_USD"

- assertVisible:
    id: "onboarding_wallet_name"

# --- Back navigation (regression: the currency step used to dead-end) ---
# Going back must leave a usable path forward: a different currency has to
# take effect and advance again, with no stale search query in the way.
- tapOn:
    id: "onboarding_back_button"

- assertVisible:
    id: "currency_search_input"

- tapOn:
    id: "currency_search_input"

- inputText: "EUR"

- tapOn:
    id: "currency_item_EUR"

# --- Wallet setup ---
- assertVisible:
    id: "onboarding_wallet_name"

- tapOn:
    id: "onboarding_wallet_name"

- inputText: "Main Account"

- tapOn:
    id: "onboarding_next_button"

# --- Completion ---
- tapOn:
    id: "onboarding_complete_button"

# --- Check the dashboard and the wallet created above ---
- assertVisible:
    id: "dashboard_screen"

- scrollUntilVisible:
    element:
      text: "Main Account"

- assertVisible:
    text: "Main Account"
