# Maestro E2E Tests — Valto Budget Tracker
#
# Onboarding Flow
# Verifies the complete onboarding experience for new users.
#
# Prerequisites: Fresh app install (no previous data)
# Run: maestro test .maestro/onboarding.yaml

appId: com.valto.app
---

# ── App Launch ──────────────────────────────────────────────────
- launchApp:
    clearState: true

# ── Welcome Screen ──────────────────────────────────────────────
- assertVisible:
    id: "onboarding_get_started"

- tapOn:
    id: "onboarding_get_started"

# ── Currency Selection ──────────────────────────────────────────
# The list is long; filter to the target instead of scrolling to it.
# Selecting a currency auto-advances - there is no separate "next" tap here.
- assertVisible:
    id: "currency_search_input"

- tapOn:
    id: "currency_search_input"

- inputText: "USD"

- tapOn:
    id: "currency_item_USD"

- assertVisible:
    id: "onboarding_wallet_name"

# ── Back Navigation (regression: the currency step used to dead-end) ─────
# Going back must leave a usable path forward: a different currency has to
# take effect and advance again, with no stale search query in the way.
- tapOn:
    id: "onboarding_back_button"

- assertVisible:
    id: "currency_search_input"

- tapOn:
    id: "currency_search_input"

- inputText: "EUR"

- tapOn:
    id: "currency_item_EUR"

# ── Wallet Setup ────────────────────────────────────────────────
- assertVisible:
    id: "onboarding_wallet_name"

- tapOn:
    id: "onboarding_wallet_name"

- inputText: "Main Account"

- tapOn:
    id: "onboarding_next_button"
    
# ── Completion ────────────────────────────────────────────────
- tapOn:
    id: "onboarding_complete_button"

# ── Verify Dashboard ────────────────────────────────────────────
- assertVisible:
    id: "dashboard_screen"
