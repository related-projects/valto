# Maestro end-to-end flow - Valto
#
# Transaction dates
# Adds an expense, an income and a transfer from the add form, each on a
# picked date that is not today, then checks the list header of that date,
# the date on each detail screen (both transfer legs included), and the
# transfer notes "Transfer to <wallet> - <typed note>" and
# "Transfer from <wallet> - <typed note>". Coverage of REGISTRE V-129.
#
# Date rule: the 15th of the previous month. Whatever the run date, it is not
# today, and not yesterday either (yesterday is in the current month, or is
# the 28th to 31st of the previous one), so its list header is a date, never
# "Today" or "Yesterday". The values are computed from the clock in UTC, the
# emulator's time zone (GMT on valto_e2e_api36). The calendar cell is tapped
# by its description ("15 October 2026"), so a calendar that is not on the
# computed month fails at that tap instead of saving another date.
#
# The transfer goes from "Savings Account" to "Main Account": a transfer may
# not exceed its source balance, and Main Account is below zero after
# create_transaction.
#
# Amounts are matched with "." in place of the currency sign (flows are ASCII).
#
# The add form is a sheet drawn over the tab bar. Its date button and its
# notes field are scrolled to until fully visible, without centring: the
# notes field is the last field and can never reach the middle of the
# screen, so a centring scroll only ended once its retries were spent, and
# on a loaded host they ran past the timeout (run of 20/11, pass 99). The
# list header of the picked date is still centred, so that the rows under
# it clear the tab bar.
#
# Prerequisites: create_wallet and change_settings passed (see config.yaml):
# two wallets, and the YYYY-MM-DD date format on the detail screen.
# Synthetic data only.
# Run: scripts/run-e2e.sh <apk>, or maestro test .maestro/transaction_dates.yaml

appId: com.renkakpo.valto.app
---

# --- The picked date ---
- evalScript: >-
    ${output.picked = (function () {
      var months = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      var shortMonths = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday',
        'Friday', 'Saturday'];
      var now = new Date();
      var year = now.getUTCFullYear();
      var month = now.getUTCMonth() - 1;
      if (month < 0) {
        month = 11;
        year = year - 1;
      }
      var weekday = days[new Date(Date.UTC(year, month, 15)).getUTCDay()];
      return {
        cell: '15 ' + months[month] + ' ' + year,
        header: weekday + ', ' + shortMonths[month] + ' 15',
        iso: year + '-' + (month < 9 ? '0' : '') + (month + 1) + '-15'
      };
    })()}

# --- Launch ---
- launchApp

# A cold start can take tens of seconds on a loaded host (pass 96 runs): wait
# for the tab bar before the first tap.
- extendedWaitUntil:
    visible:
      id: "tab_index"
    timeout: 60000

# An Android "isn't responding" dialog, if one is up, is answered "Wait".
- runFlow: subflows/dismiss_not_responding.yaml

- tapOn:
    id: "tab_transactions"

# --- Expense: Transport, 11.11, Main Account ---
- tapOn:
    id: "fab_add_transaction"

- assertVisible:
    id: "add_tx_amount_input"

- tapOn:
    id: "add_tx_type_expense"

- tapOn:
    id: "add_tx_category_picker"

- tapOn:
    id: "add_tx_category_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "Transport"

- tapOn:
    id: "add_tx_wallet_picker"

- tapOn:
    id: "add_tx_wallet_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "Main Account"

- scrollUntilVisible:
    element:
      id: "add_tx_date_button"
    visibilityPercentage: 100

- tapOn:
    id: "add_tx_date_button"

- tapOn:
    id: "android:id/prev"

- tapOn:
    text: "${output.picked.cell}"

- tapOn:
    id: "android:id/button1"

- scrollUntilVisible:
    element:
      id: "add_tx_amount_input"
    direction: UP

- tapOn:
    id: "add_tx_amount_input"

- inputText: "11.11"

- tapOn:
    id: "add_tx_save_button"

- assertNotVisible:
    id: "add_tx_amount_input"

# --- Income: Freelance, 22.22, Main Account ---
- tapOn:
    id: "fab_add_transaction"

- assertVisible:
    id: "add_tx_amount_input"

- tapOn:
    id: "add_tx_type_income"

- tapOn:
    id: "add_tx_category_picker"

- tapOn:
    id: "add_tx_category_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "Freelance"

- tapOn:
    id: "add_tx_wallet_picker"

- tapOn:
    id: "add_tx_wallet_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "Main Account"

- scrollUntilVisible:
    element:
      id: "add_tx_date_button"
    visibilityPercentage: 100

- tapOn:
    id: "add_tx_date_button"

- tapOn:
    id: "android:id/prev"

- tapOn:
    text: "${output.picked.cell}"

- tapOn:
    id: "android:id/button1"

- scrollUntilVisible:
    element:
      id: "add_tx_amount_input"
    direction: UP

- tapOn:
    id: "add_tx_amount_input"

- inputText: "22.22"

- tapOn:
    id: "add_tx_save_button"

- assertNotVisible:
    id: "add_tx_amount_input"

# --- Transfer: Savings Account -> Main Account, 33.33, with a note ---
- tapOn:
    id: "fab_add_transaction"

- assertVisible:
    id: "add_tx_amount_input"

- tapOn:
    id: "add_tx_type_transfer"

- tapOn:
    id: "add_tx_wallet_picker"

- tapOn:
    id: "add_tx_wallet_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "Savings Account"

- tapOn:
    id: "add_tx_dest_wallet_picker"

- tapOn:
    id: "add_tx_dest_wallet_[0-9a-f]{8}-.*"
    containsDescendants:
      - text: "Main Account"

- scrollUntilVisible:
    element:
      id: "add_tx_date_button"
    visibilityPercentage: 100

- tapOn:
    id: "add_tx_date_button"

- tapOn:
    id: "android:id/prev"

- tapOn:
    text: "${output.picked.cell}"

- tapOn:
    id: "android:id/button1"

- scrollUntilVisible:
    element:
      id: "add_tx_amount_input"
    direction: UP

- tapOn:
    id: "add_tx_amount_input"

- inputText: "33.33"

- scrollUntilVisible:
    element:
      id: "add_tx_notes_input"
    visibilityPercentage: 100

- tapOn:
    id: "add_tx_notes_input"

- inputText: "E2E dated transfer"

- tapOn:
    id: "add_tx_save_button"

- assertNotVisible:
    id: "add_tx_amount_input"

# --- The list: one header for the picked date, the four rows under it ---
# The header is drawn upper case; matched case-insensitively.
- scrollUntilVisible:
    element:
      text: "(?i)${output.picked.header}"
    centerElement: true

- assertVisible:
    id: "transaction_list_row_.*"
    below:
      text: "(?i)${output.picked.header}"
    containsDescendants:
      - text: "Transport"
      - text: "-.11\\.11"

- assertVisible:
    id: "transaction_list_row_.*"
    below:
      text: "(?i)${output.picked.header}"
    containsDescendants:
      - text: "Freelance"
      - text: "\\+.22\\.22"

- assertVisible:
    id: "transaction_list_row_.*"
    below:
      text: "(?i)${output.picked.header}"
    containsDescendants:
      - text: "Transfer"
      - text: "Savings Account"
      - text: "-.33\\.33"

- assertVisible:
    id: "transaction_list_row_.*"
    below:
      text: "(?i)${output.picked.header}"
    containsDescendants:
      - text: "Transfer"
      - text: "Main Account"
      - text: "\\+.33\\.33"

# --- Details: the picked date on each, the note on each transfer leg ---
- tapOn:
    id: "transaction_list_row_.*"
    containsDescendants:
      - text: "Transport"
      - text: "-.11\\.11"

- assertVisible:
    text: "${output.picked.iso}"

- back

- tapOn:
    id: "transaction_list_row_.*"
    containsDescendants:
      - text: "Freelance"
      - text: "\\+.22\\.22"

- assertVisible:
    text: "${output.picked.iso}"

- back

- tapOn:
    id: "transaction_list_row_.*"
    containsDescendants:
      - text: "Transfer"
      - text: "Savings Account"
      - text: "-.33\\.33"

- assertVisible:
    text: "${output.picked.iso}"

- assertVisible:
    text: "Transfer to Main Account - E2E dated transfer"

- back

- tapOn:
    id: "transaction_list_row_.*"
    containsDescendants:
      - text: "Transfer"
      - text: "Main Account"
      - text: "\\+.33\\.33"

- assertVisible:
    text: "${output.picked.iso}"

- assertVisible:
    text: "Transfer from Savings Account - E2E dated transfer"

- back
