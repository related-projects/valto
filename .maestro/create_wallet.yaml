# Maestro end-to-end flow - Valto
#
# Create wallet
# Adds a savings wallet from the Wallets tab and checks it is listed on the
# dashboard.
#
# Prerequisites: onboarding completed (onboarding.yaml runs first, see
# config.yaml). Synthetic data only.
# Run: scripts/run-e2e.sh <apk>, or maestro test .maestro/create_wallet.yaml

appId: com.renkakpo.valto.app
---

# --- Launch ---
- launchApp

# --- Open the add-wallet sheet ---
- tapOn:
    id: "tab_wallets"

- tapOn:
    id: "wallets_add_button"

- assertVisible:
    id: "add_wallet_name_input"

# --- Fill the form ---
# The type is picked first, before a keyboard can cover the type buttons.
- tapOn:
    id: "add_wallet_type_savings"

- tapOn:
    id: "add_wallet_name_input"

- inputText: "Savings Account"

- tapOn:
    id: "add_wallet_balance_input"

- inputText: "1000"

# --- Save (header button, above the keyboard) ---
- tapOn:
    id: "add_wallet_save_button"

# --- Check the created wallet ---
# The sheet closed, and the dashboard wallet list shows the new wallet.
- assertNotVisible:
    id: "add_wallet_name_input"

- tapOn:
    id: "tab_index"

- scrollUntilVisible:
    element:
      text: "Savings Account"

- assertVisible:
    text: "Savings Account"
